<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css" />
    <title>Document</title>
</head>
<body>
  <main class="container">
    <h1>Заявки на отпуск</h1>

    <section class="card">
      <h2>Новая заявка</h2>
      <form id="create-form" novalidate>
        <label>ФИО
          <input name="fullName" type="text" required />
        </label>
        <div class="row">
          <label>Дата с
            <input name="dateFrom" type="date" required />
          </label>
          <label>Дата по
            <input name="dateTo" type="date" required />
          </label>
        </div>
        <label>Причина
          <textarea name="reason" rows="2" required></textarea>
        </label>
        <div id="form-errors" class="errors" hidden></div>
        <button type="submit">Отправить</button>
      </form>
    </section>

    <section class="card">
      <div class="list-header">
        <h2>Список заявок</h2>
        <label>Фильтр по статусу
          <select id="status-filter">
            <option value="all">Все</option>
            <option value="pending">Ожидает</option>
            <option value="approved">Одобрена</option>
            <option value="rejected">Отклонена</option>
          </select>
        </label>
      </div>
      <div id="list-errors" class="errors" hidden></div>
      <table id="requests-table">
        <thead>
          <tr>
            <th>ФИО</th>
            <th>Период</th>
            <th>Дней</th>
            <th>Причина</th>
            <th>Статус</th>
            <th>Действия</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
